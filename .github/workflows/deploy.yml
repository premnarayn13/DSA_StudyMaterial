name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify dataset integrity
        run: python Problems_List/scripts/verify_site_data.py

      - name: Verify README statistics match dataset
        run: python Problems_List/scripts/check_readme.py

      - name: Stamp asset URLs with content hash
        run: python Problems_List/scripts/stamp_assets.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Problems_List/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
